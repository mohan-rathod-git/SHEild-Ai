# ═══════════════════════════════════════════════════════════
# SHEildAI — Docker Compose (Development)
#
# Runs the frontend dev server, backend API, and ML service.
# The DATABASE is NOT here — it lives on Supabase Cloud.
# See supabase/README.md for setup instructions.
# ═══════════════════════════════════════════════════════════

services:
  # ── Frontend (Vite dev server) ──────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
    env_file:
      - ../frontend/.env
    environment:
      - NODE_ENV=development

  # ── Backend (FastAPI + Uvicorn) ─────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    env_file:
      - ../backend/.env
    depends_on:
      - ml-service

  # ── ML Service ─────────────────────────────────────────
  ml-service:
    build:
      context: ../ml-service
      dockerfile: ../infra/Dockerfile.ml
    ports:
      - "8001:8001"
    volumes:
      - ../ml-service:/app
